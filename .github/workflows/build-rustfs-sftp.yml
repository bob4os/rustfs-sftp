name: Build RustFS (SFTP)

on:
  schedule:
    - cron: "17 8,16 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (empty = auto-detect)"
        required: false
      force:
        description: "Rebuild even if the image tag already exists"
        type: boolean
        default: false

env:
  UPSTREAM: rustfs/rustfs
  IMAGE: ghcr.io/${{ github.repository_owner }}/rustfs-sftp
  FEATURES: sftp
  INCLUDE_PRERELEASES: "false"

permissions:
  contents: read
  packages: write

concurrency:
  group: rustfs-sftp
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Resolve upstream tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "$INCLUDE_PRERELEASES" = "true" ]; then
            TAG=$(gh api "repos/$UPSTREAM/releases?per_page=1" --jq '.[0].tag_name')
          else
            TAG=$(gh api "repos/$UPSTREAM/releases/latest" --jq '.tag_name')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Upstream tag: $TAG"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Skip if already built
        id: check
        run: |
          if [ "${{ inputs.force }}" != "true" ] && \
             docker buildx imagetools inspect "$IMAGE:${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "Image exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.check.outputs.skip == 'false'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v7
        if: steps.check.outputs.skip == 'false'
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.tag.outputs.tag }}

      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.skip == 'false'

      - uses: docker/build-push-action@v7
        if: steps.check.outputs.skip == 'false'
        with:
          context: .
          file: Dockerfile.source
          platforms: linux/amd64
          push: true
          build-args: |
            RUSTFS_BUILD_FEATURES=${{ env.FEATURES }}
            VCS_REF=${{ steps.tag.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
